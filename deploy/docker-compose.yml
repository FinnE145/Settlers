# fe-pro deployment (see /srv/fe-pro/SERVER.md). Run from /srv/stacks/settlers/repo/deploy:
#   docker compose up -d --build
# The root docker-compose.yml is the generic version; this one follows the server's
# stack convention: state in /srv/stacks/settlers/data, published on the tailnet only.
# The project name. Without it Compose names the project after the directory, "deploy", which symr's and settlers'
# deploy directories share, so each saw the other's container as an orphan (and --remove-orphans would delete it).
name: settlers
services:
  settlers:
    build: { context: .. }
    image: settlers
    container_name: settlers
    # svc (2003), fe-pro's shared account for ordinary web services (SERVER.md, "Accounts"). It owns
    # /srv/stacks/settlers/data. The store writes game.json mode 600 (mkstemp), so a hand edit needs sudo.
    user: "2003:2003"
    volumes:
      - /srv/stacks/settlers/data:/data
    ports:
      # Tailnet interface only -- never 0.0.0.0. The app has no accounts; Tailscale is the
      # boundary (the app's own address check is a second layer, not the only one).
      - "100.64.132.111:45670:8000"
    restart: unless-stopped
